spring.application.name=local-service-finder
# ===== MySQL Datasource =====
spring.datasource.url=jdbc:mysql://localhost:3306/local_service_finder?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Pranjal@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Keeps the Hibernate session open through JSON serialization so lazy-loaded
# fields (User, ServiceCategory, etc. on ServiceProvider/Booking) don't throw

# LazyInitializationException when entities are returned directly from controllers.
# Fine for a student project; in production you'd map to DTOs instead.
spring.jpa.open-in-view=true

# ===== Server =====
server.port=8080

# ===== JWT =====
app.jwt.secret=ChangeThisSecretKeyToSomethingLongAndRandomForProductionUse123456
app.jwt.expiration-ms=86400000

# ===== UPI (simulated / VPA of the platform for demo) =====
app.upi.payee-vpa=localservicefinder@upi
app.upi.payee-name=LocalServiceFinder

# ===== CORS =====
app.cors.allowed-origins=http://localhost:5173
spring.jackson.serialization.fail-on-empty-beans=false
